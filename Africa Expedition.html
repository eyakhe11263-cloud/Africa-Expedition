<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Africa Expedition</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: sticky game bar on top; play screen = question panel + zoomable map card (stacked on phones).
   Look: one committed "ocean atlas" world: deep sea navy, region-coded land, gold for rewards. */
:root{
  --sea:#0d2b4a; --sea2:#14456f; --paper:#f3f7fb; --ink:#0c2340; --muted:#4d6a88;
  --gold:#ffc83d; --good:#1f9d66; --bad:#d6453d; --line:#c9d8e8;
  --rN:#e9b24f; --rW:#52b89c; --rC:#ee8f6e; --rE:#86a6ea; --rS:#aac95e; --plain:#a9c6dc;
  --disp:'Fredoka','Trebuchet MS',system-ui,sans-serif; --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sea);color:#fff;font-family:var(--body);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px}
h1,h2,h3{font-family:var(--disp);font-weight:600;margin:0;text-wrap:balance;line-height:1.15}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1140px;margin:0 auto}
.btn{background:var(--gold);color:var(--ink);border:0;border-radius:12px;padding:11px 20px;font-weight:800;font-family:var(--disp);font-size:1.05rem;box-shadow:0 3px 0 #b88a10;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b88a10}
.btn.ghost{background:transparent;color:#fff;border:2px solid #ffffff55;box-shadow:none;padding:8px 16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.small{font-size:.9rem;color:#b8cde3}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sea);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:12px;border-bottom:1px solid #ffffff22}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sea)}
.brand{font-family:var(--disp);font-weight:700;font-size:1.3rem;display:flex;gap:10px;align-items:center;background:none;border:0;color:#fff;padding:0}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--gold);display:inline-block}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:#ffffff14;border-radius:999px;padding:5px 14px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{color:var(--gold)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;align-items:center;padding-block:28px 12px}
.hero h1{font-size:clamp(2.2rem,6vw,3.6rem)}
.hero p{max-width:52ch;color:#d3e2f1}
.hero svg{width:100%;max-height:440px}
.namebox{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.namebox input{flex:1 1 180px;min-width:0;border-radius:12px;border:2px solid #ffffff44;background:#ffffff12;color:#fff;padding:11px 14px;font:inherit;font-weight:700}
.namebox input::placeholder{color:#9fb7d0}
h2.sec{font-size:1.5rem;margin:30px 0 12px}
.zonehead{font-family:var(--disp);color:var(--gold);margin:18px 0 8px;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lv{background:var(--paper);color:var(--ink);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lv h3{font-size:1.15rem}
.lv p{margin:0;color:var(--muted);font-size:.95rem;flex:1}
.lv .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sea2);color:#fff;font-family:var(--disp);font-weight:700;font-size:.95rem}
.stars{color:#c3d1e0;letter-spacing:2px;font-size:1.1rem}
.stars .on{color:#e8a600}
.lv .btn{padding:8px 16px;font-size:1rem}
.lv.locked{opacity:.65}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:#ffffff10;border-radius:16px;padding:18px;min-width:0}
.card h3{font-size:1.2rem;margin-bottom:10px}
details.how{background:#ffffff10;border-radius:16px;padding:6px 18px}
details.how summary{cursor:pointer;font-family:var(--disp);font-size:1.25rem;padding:12px 0;font-weight:600}
details.how ol,details.how ul{padding-left:1.2em;margin:6px 0 14px}
details.how li{margin:4px 0}
table.lb{width:100%;border-collapse:collapse}
table.lb td{padding:6px 4px;border-bottom:1px solid #ffffff1c;font-variant-numeric:tabular-nums}
table.lb td:last-child{text-align:right;color:var(--gold);font-weight:800}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.bdg{background:#ffffff0f;border-radius:12px;padding:10px;text-align:center;font-size:.85rem;opacity:.5}
.bdg.got{opacity:1;background:#ffc83d22;outline:2px solid var(--gold)}
.bdg b{display:block;font-family:var(--disp);font-size:.98rem}
.bdg svg{width:34px;height:34px;display:block;margin:0 auto 4px}

/* play */
.play{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:20px;padding-top:18px;align-items:start}
.panel{background:var(--paper);color:var(--ink);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.prog{display:flex;gap:4px}
.prog span{flex:1;height:8px;border-radius:4px;background:#c9d8e8}
.prog span.done{background:var(--good)}
.prog span.cur{background:var(--gold)}
.qmeta{display:flex;justify-content:space-between;gap:8px;font-weight:800;color:var(--muted);font-size:.92rem}
.q{font-size:1.45rem;color:var(--ink)}
.q small{display:block;font-family:var(--body);font-weight:600;font-size:.95rem;color:var(--muted);margin-top:6px}
.opts{display:grid;gap:10px}
.opt{background:#fff;border:2px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 14px;text-align:left;font-weight:800}
.opt:hover:not([disabled]){border-color:var(--sea2)}
.opt.right{background:#d8f3e6;border-color:var(--good)}
.opt.wrong{background:#fbe0de;border-color:var(--bad);text-decoration:line-through;opacity:.8}
.opt[disabled]{cursor:default}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.tools .btn{padding:8px 14px;font-size:.95rem}
.fb{border-radius:12px;padding:12px 14px;font-weight:700;background:#e6eef7;min-height:3em}
.fb.good{background:#d8f3e6}
.fb.bad{background:#fbe0de}
.fb .fact{display:block;font-weight:600;color:var(--muted);margin-top:4px}
.stage{background:var(--sea2);border-radius:18px;padding:10px;position:relative;min-width:0}
.stage svg,.stage canvas{display:block;width:100%;height:auto;border-radius:12px;touch-action:none}
#map{aspect-ratio:760/690;max-height:78vh;margin-inline:auto;background:var(--sea2);cursor:default}
.zoom{position:absolute;right:18px;top:18px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom button{width:38px;height:38px;border-radius:10px;border:0;background:#ffffffee;color:var(--ink);font-weight:800;font-size:1.2rem}
#globeWrap{display:grid;place-items:center;padding:10px}
#globe{max-width:440px;cursor:grab;border-radius:50%!important}
#world{aspect-ratio:760/400;background:#14456f}

/* map styling */
.c{stroke:#0d2b4a;stroke-width:.9;vector-effect:non-scaling-stroke;fill:var(--plain);cursor:pointer;transition:fill .15s}
.r-N{fill:var(--rN)}.r-W{fill:var(--rW)}.r-C{fill:var(--rC)}.r-E{fill:var(--rE)}.r-S{fill:var(--rS)}
.plain .c{fill:var(--plain)}
.c:hover{filter:brightness(1.12)}
.c.off{fill:#6f93ad;opacity:.55}
.c.dim{opacity:.32}
.c.target{fill:var(--gold)!important;stroke:#fff;stroke-width:2}
.c.good{fill:#35c58a!important;stroke:#fff;stroke-width:1.6}
.c.bad{fill:var(--bad)!important;animation:shake .3s}
.c.mist{fill:#f6e27a!important;stroke:#fff;stroke-width:1.6;animation:pulse 1s infinite alternate}
.no-c .c,.no-c .hit{cursor:not-allowed}
.no-c .ctx,.no-c .ws{pointer-events:all}
.ctx{fill:#24608c;stroke:none;pointer-events:none}
.ws{fill:#7f9bb0;stroke:#0d2b4a;stroke-width:.6;vector-effect:non-scaling-stroke;pointer-events:none}
.hit{fill:#fff;fill-opacity:0;stroke:#ffffff88;stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer}
.hit:hover{fill-opacity:.25}
.line{fill:none;stroke:#fff;stroke-width:1.4;stroke-dasharray:6 5;vector-effect:non-scaling-stroke;pointer-events:none;opacity:.9}
.line.tr{stroke:#ffffff77;stroke-width:1}
.ltxt{font:700 13px var(--body);fill:#fff;paint-order:stroke;stroke:#0d2b4a;stroke-width:3px;pointer-events:none}
.mtxt{font:700 14px var(--body);fill:#fff;paint-order:stroke;stroke:#0d2b4a;stroke-width:3.5px;pointer-events:none}
.zone ellipse{fill:#fff;stroke:none;cursor:pointer}
.zs{opacity:.2}
.zone:hover .zs{opacity:.34}
.zone.good .zs{opacity:.7}.zone.good ellipse{fill:#35c58a}
.zone.bad .zs{opacity:.7}.zone.bad ellipse{fill:var(--bad)}
.zq{font:800 30px var(--disp);fill:#ffffffcc;pointer-events:none;text-anchor:middle}
.zl{font:700 20px var(--disp);fill:#fff;text-anchor:middle;paint-order:stroke;stroke:#0d2b4a;stroke-width:4px;pointer-events:none}
.zmark{fill:#fff;fill-opacity:0;stroke:var(--gold);stroke-width:3;pointer-events:none;animation:pulse 1s infinite alternate}
.zhit{fill:#fff;fill-opacity:0;cursor:pointer}
.zhit:hover{fill-opacity:.2}
.wc{fill:#6f93ad;stroke:#0d2b4a;stroke-width:.4;vector-effect:non-scaling-stroke;cursor:pointer}
.wc:hover{fill:#86a8c2}
.wc.afr{fill:var(--gold)}
.wc.bad{fill:var(--bad)}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes pulse{to{opacity:.5}}

/* modal */
.modal{position:fixed;inset:0;background:#06162bcc;display:grid;place-items:center;z-index:50;padding:16px}
.mbox{background:var(--paper);color:var(--ink);border-radius:20px;padding:26px;max-width:520px;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.mbox h2{font-size:1.9rem}
.big{font-family:var(--disp);font-size:2.6rem;color:var(--ink)}
.bigstars{font-size:2.4rem;color:#e8a600;letter-spacing:6px}
.bigstars .off{color:#c3d1e0}
.mbox ul{margin:0;padding-left:1.2em}
.mbox .btns{display:flex;gap:10px;flex-wrap:wrap}
.mbox .btn.ghost{color:var(--ink);border-color:var(--line)}
.newb{display:flex;gap:8px;flex-wrap:wrap}
.newb span{background:#ffe9a6;border-radius:999px;padding:4px 12px;font-weight:800;font-size:.9rem}

@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .play{grid-template-columns:1fr}
  .hero svg{max-height:300px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>

<script>
(function(){
'use strict';
/* ---------- data ---------- */
const REG={N:'North Africa',W:'West Africa',C:'Central Africa',E:'East Africa',S:'Southern Africa'};
const ZONE_TXT={N:'North of the Equator',S:'South of the Equator',Q:'On the Equator'};
const ISL=new Set([450,174,480,690,132,678]);
const C=CD.map(r=>({id:r[0],name:r[1],cap:r[2],reg:r[3],ll:!!r[4],zone:r[5]}));
const byId={};C.forEach(c=>byId[c.id]=c);
const AFR=new Set(C.map(c=>c.id));AFR.add(732);
const NB={};Object.keys(MAP.nb).forEach(k=>NB[k]=MAP.nb[k].filter(i=>AFR.has(i)&&i!==732));
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
const factOf=c=>`${c.name}: capital ${c.cap}. ${ISL.has(c.id)?'An island country, surrounded by ocean.':(c.ll?'Landlocked, so it has no coastline.':'It has a coastline.')} ${ZONE_TXT[c.zone]}. Found in ${REG[c.reg]}.`;

/* ---------- storage ---------- */
let mem=null;
const load=()=>{try{const s=localStorage.getItem('africaExpedition.v1');if(s)return JSON.parse(s)}catch(e){}return mem};
const save=()=>{mem=P;try{localStorage.setItem('africaExpedition.v1',JSON.stringify(P))}catch(e){}};
let P=load()||{name:'',levels:{},badges:[],lb:[],bestStreak:0};
P.levels=P.levels||{};P.badges=P.badges||[];P.lb=P.lb||[];

const BADGES={
  world:['Globe Trotter','Found Africa on the globe'],sea:['Sea Captain','Named the waters around Africa'],
  border:['Border Guard','Understood countries and borders'],
  rN:['North Scout','Located every North African country'],rW:['West Scout','Located every West African country'],
  rC:['Central Scout','Located every Central African country'],rE:['East Scout','Located every East African country'],
  rS:['Southern Scout','Located every Southern African country'],
  mapmaster:['Map Master','Completed all five region missions'],
  capitals:['Capital Champion','Matched countries and capitals'],coast:['Coast Watcher','Sorted coastal and landlocked countries'],
  islands:['Island Hopper','Mastered Madagascar and Zanzibar'],final:['Africa Champion','Won the Pan-African Challenge'],
  streak:['Streak Star','Got 8 right in a row'],perfect:['Perfect Run','Finished a level with no mistakes']
};

/* ---------- question generators ---------- */
const clickQ=(c,extra)=>Object.assign({kind:'click',text:`Find and click ${c.name}.`,target:[c.id],accept:id=>id===c.id,hintReg:c.reg,fact:factOf(c)},extra||{});
function mcqCap(c){
  const pool=C.filter(x=>x.id!==c.id&&x.cap!==c.cap);
  const same=shuffle(pool.filter(x=>x.reg===c.reg)).slice(0,3);
  const more=shuffle(pool.filter(x=>x.reg!==c.reg));
  const d=same.concat(more).slice(0,3).map(x=>x.cap);
  return{kind:'mcq',text:`What is the capital city of ${c.name}?`,options:shuffle([c.cap,...d]),answer:c.cap,focus:c.id,showCap:c.id,fact:factOf(c)};
}
function capClick(c){return{kind:'click',text:`${c.cap} is the capital city of which country? Click that country.`,target:[c.id],accept:id=>id===c.id,hintReg:c.reg,showCapOnReveal:c.id,fact:factOf(c)}}
function zoneQ(c){return{kind:'mcq',text:`Where is ${c.name} compared with the Equator?`,options:['North of the Equator','On the Equator','South of the Equator'],answer:ZONE_TXT[c.zone],focus:c.id,equator:true,fact:factOf(c)}}
function coastQ(c){return{kind:'mcq',text:`Is ${c.name} landlocked or does it have a coastline?`,options:['Landlocked','Has a coastline'],answer:c.ll?'Landlocked':'Has a coastline',focus:c.id,fact:factOf(c)+(c.ll?' Landlocked means surrounded by other countries.':'')}}
function nbQ(c){return{kind:'click',text:`Click a country that shares a border with ${c.name}.`,sub:'Any neighbour counts.',target:[c.id],accept:id=>(NB[c.id]||[]).includes(id),reveal:NB[c.id],focus:c.id,fact:`${c.name} shares borders with: ${NB[c.id].map(i=>byId[i].name).join(', ')}.`}}
const ZONES={
  atl:{name:'Atlantic Ocean',hint:'It lies along the west coast of Africa.',fact:'The Atlantic Ocean borders the whole west coast of Africa, from Morocco down to South Africa.'},
  ind:{name:'Indian Ocean',hint:'It lies along the east coast, around Madagascar.',fact:'The Indian Ocean borders the east coast of Africa. Madagascar, Mauritius, Seychelles and Comoros lie in it.'},
  south:{name:'Southern Ocean',hint:'It is at the very bottom of the map.',fact:'The Southern Ocean circles Antarctica, south of Africa. Many atlases mark it as a fifth ocean.'},
  med:{name:'Mediterranean Sea',hint:'It is a sea, not an ocean. It separates Africa from Europe in the north.',fact:'The Mediterranean Sea lies between Africa and Europe. Egypt, Libya, Tunisia, Algeria and Morocco have coasts on it.'},
  red:{name:'Red Sea',hint:'It is a narrow sea between Africa and Asia.',fact:'The Red Sea separates north-east Africa from the Arabian Peninsula. Egypt, Sudan, Eritrea and Djibouti touch it.'}
};
const zoneQuestion=(k)=>({kind:'zone',zone:k,text:`Click the ${ZONES[k].name}.`,sub:ZONES[k].name.includes('Sea')?'A sea is smaller than an ocean and partly surrounded by land.':'Click the shaded water area.',hint:ZONES[k].hint,fact:ZONES[k].fact});

/* ---------- levels ---------- */
const LEVELS=[
 {id:'world',zone:'Zone 1 · The big picture',title:'Africa on the World',blurb:'Find Africa on a globe and on a world map.',badge:'world',
  learn:['Africa is a continent south of Europe.','A globe shows true shapes. Flat maps stretch some places.','The Equator and the Prime Meridian both cross Africa.'],
  build:()=>[
   {kind:'globe',text:'Spin the globe and bring Africa into the middle of the circle.',sub:'Drag the globe with your finger or mouse, then press the button.',hint:'Africa is south of Europe. The Atlantic Ocean is on its west side.',fact:'Africa is the second-largest continent. The globe shows it in its true shape.'},
   {kind:'world',text:'Now click Africa on this flat world map.',sub:'This is a world map.',hint:'Look for the continent just south of Europe.',fact:'On a flat world map the continents are stretched. A globe is the most accurate model of Earth.'},

let svg,gC,gHits,gMarks,gZones,gLines,VY0=80,VH=690,vb={x:0,y:80,w:MAP.W,h:690},dragged=false;
function buildMapSVG(){
  const ids=C.map(c=>c.id);
  const paths=ids.map(i=>`<path class="c r-${byId[i].reg}" data-id="${i}" d="${MAP.paths[i]}"><title></title></path>`).join('');
  const hits=ids.filter(i=>MAP.area[i]<400).map(i=>{const p=MAP.cent[i];return `<circle class="hit" data-id="${i}" cx="${p[0]}" cy="${p[1]}" r="9"/>`}).join('');
  const zp=MAP.zonePts;
  const E=(c,rx,ry,rot)=>`<ellipse cx="${c[0]}" cy="${c[1]}" rx="${rx}" ry="${ry}" ${rot?`transform="rotate(${rot} ${c[0]} ${c[1]})"`:''}/>`;
  const Z=(k,shapes,lab)=>`<g class="zone" data-z="${k}"><g class="zs">${shapes}</g><text class="zq" x="${lab[0]}" y="${lab[1]+10}">?</text></g>`;
  const zones=
   Z('south',E([380,712],250,58),[380,712])+
   Z('atl',E(zp.atl,95,250)+E(zp.gog,130,95)+E(zp.satl,160,110),[60,370])+
   Z('ind',E(zp.ind,95,200)+E(zp.eaf,100,80)+E(zp.moz,60,110),[690,500])+
   Z('med',E(zp.med,115,24),zp.med)+
   Z('red',E(zp.red,15,62,-35),zp.red);
  return `<svg id="map" viewBox="0 80 ${MAP.W} 690" role="img" aria-label="Map of Africa">
   <rect x="-400" y="-400" width="${MAP.W+800}" height="${MAP.H+800}" fill="#14456f"/>
   <g id="zones">${zones}</g>
   <path class="ctx" d="${MAP.ctx}"/><path class="ws" d="${MAP.ws}"/>
   <g id="countries">${paths}</g><g id="hits">${hits}</g>
   <g id="lines" style="display:none"><path class="line tr" d="${MAP.capricorn}"/><path class="line tr" d="${MAP.cancer}"/><path class="line" d="${MAP.equator}"/><path class="line" d="${MAP.meridian}"/>
    <text class="ltxt" x="${MAP.eqLabel[0]+4}" y="${MAP.eqLabel[1]-6}">Equator 0°</text><text class="ltxt" x="${MAP.pmLabel[0]+6}" y="${MAP.pmLabel[1]}">Prime Meridian</text></g>
   <g id="marks"></g></svg>`;
}
function setVB(){svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`)}
function zoomBy(f,cx,cy){
  const nw=Math.min(MAP.W,Math.max(110,vb.w/f)),nh=nw*VH/MAP.W;
  cx=cx??vb.x+vb.w/2;cy=cy??vb.y+vb.h/2;
  const rx=(cx-vb.x)/vb.w,ry=(cy-vb.y)/vb.h;
  vb.x=Math.max(0,Math.min(MAP.W-nw,cx-rx*nw));vb.y=Math.max(VY0,Math.min(VY0+VH-nh,cy-ry*nh));vb.w=nw;vb.h=nh;setVB();
}
function resetVB(){vb={x:0,y:VY0,w:MAP.W,h:VH};setVB()}
function focusOn(id){
  const b=MAP.bbox[id];let w=Math.max(220,(b[2]-b[0])*2.4);const h=w*VH/MAP.W;
  const cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2;w=Math.min(w,MAP.W);
  vb.w=w;vb.h=w*VH/MAP.W;vb.x=Math.max(0,Math.min(MAP.W-vb.w,cx-vb.w/2));vb.y=Math.max(VY0,Math.min(VY0+VH-vb.h,cy-vb.h/2));setVB();
}
function svgPt(e){const r=svg.getBoundingClientRect();return[vb.x+(e.clientX-r.left)/r.width*vb.w,vb.y+(e.clientY-r.top)/r.height*vb.h]}
function wireMap(){
  svg=$('#map');gC=$('#countries');gHits=$('#hits');gMarks=$('#marks');gZones=$('#zones');gLines=$('#lines');
  let sx,sy,svb,down=false;
  svg.addEventListener('pointerdown',e=>{down=true;dragged=false;sx=e.clientX;sy=e.clientY;svb={...vb}});
  window.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!dragged&&Math.hypot(dx,dy)>6)dragged=true;
    if(dragged&&vb.w<MAP.W){const r=svg.getBoundingClientRect();vb.x=Math.max(0,Math.min(MAP.W-vb.w,svb.x-dx/r.width*vb.w));vb.y=Math.max(VY0,Math.min(VY0+VH-vb.h,svb.y-dy/r.height*vb.h));setVB()}});
  window.addEventListener('pointerup',()=>{down=false});
  svg.addEventListener('wheel',e=>{e.preventDefault();const p=svgPt(e);zoomBy(e.deltaY<0?1.25:.8,p[0],p[1])},{passive:false});
  svg.addEventListener('click',e=>{if(dragged){dragged=false;return}handleMapClick(e)});
}
function clearMap(){
  gC.querySelectorAll('.c').forEach(p=>{p.setAttribute('class','c r-'+byId[p.dataset.id].reg)});
  gMarks.innerHTML='';gZones.style.display='none';
  gZones.querySelectorAll('.zone').forEach(z=>z.setAttribute('class','zone'));
  gZones.querySelectorAll('.zl').forEach(t=>t.remove());

}
const cEl=id=>gC.querySelector(`[data-id="${id}"]`);
function mark(id,cls){const e=cEl(id);if(e)e.classList.add(cls)}
const sc=()=>vb.w/MAP.W;
function label(id,txt){const p=MAP.cent[id],s=sc();const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('class','ltxt');t.setAttribute('x',p[0]);t.setAttribute('y',p[1]-(AREA_SMALL(id)?12*s:0));t.setAttribute('text-anchor','middle');t.style.fontSize=(13*s)+'px';t.style.strokeWidth=(3*s)+'px';t.textContent=txt;gMarks.appendChild(t)}
const AREA_SMALL=id=>MAP.area[id]<400;
function capMark(id){const p=MAP.cap[id],s=sc();const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.innerHTML=`<circle cx="${p[0]}" cy="${p[1]}" r="${6*s}" fill="#fff" stroke="#0c2340" stroke-width="${2.5*s}"/><text class="mtxt" x="${p[0]+9*s}" y="${p[1]+5*s}" style="font-size:${14*s}px;stroke-width:${3.5*s}px">${esc(byId[id].cap)}</text>`;gMarks.appendChild(g)}

/* ---------- globe & world ---------- */
let globe={rot:[150,-10],R:0,drag:false};
function drawGlobe(solved){
  const cv=$('#globe'),ctx=cv.getContext('2d');const size=cv.width;
  const proj=GEO.geoOrthographic().scale(size/2-6).translate([size/2,size/2]).rotate(globe.rot).clipAngle(90);
  const path=GEO.geoPath(proj,ctx);
  ctx.clearRect(0,0,size,size);
  const g=ctx.createRadialGradient(size*.4,size*.35,size*.1,size/2,size/2,size/2);g.addColorStop(0,'#2c78ad');g.addColorStop(1,'#0e3c63');
  ctx.beginPath();path({type:'Sphere'});ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();path(GEO.geoGraticule10());ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;ctx.stroke();
  const land=GEO.feature(WORLD,WORLD.objects.land);
  ctx.beginPath();path(land);ctx.fillStyle='#8cb08a';ctx.fill();
  const af=GEO.feature(WORLD,WORLD.objects.countries).features.filter(f=>AFR.has(+f.id));
  if(solved){ctx.beginPath();af.forEach(f=>path(f));ctx.fillStyle='#ffc83d';ctx.fill()}
  ctx.beginPath();path({type:'Sphere'});ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.arc(size/2,size/2,size*.17,0,7);ctx.strokeStyle='#ffc83d';ctx.setLineDash([8,6]);ctx.lineWidth=3;ctx.stroke();ctx.setLineDash([]);
}
function wireGlobe(){
  const cv=$('#globe');cv.width=cv.height=720;let lx,ly;
  cv.addEventListener('pointerdown',e=>{globe.drag=true;lx=e.clientX;ly=e.clientY;cv.style.cursor='grabbing'});
  window.addEventListener('pointermove',e=>{if(!globe.drag)return;const k=0.4;
    globe.rot[0]+=(e.clientX-lx)*k;globe.rot[1]=Math.max(-70,Math.min(70,globe.rot[1]-(e.clientY-ly)*k));lx=e.clientX;ly=e.clientY;drawGlobe(G&&G.globeSolved)});
  window.addEventListener('pointerup',()=>{globe.drag=false;cv.style.cursor='grab'});
}
function buildWorld(){
  const fc=GEO.feature(WORLD,WORLD.objects.countries);const feats=fc.features.filter(f=>+f.id!==10);
  const p=GEO.geoEquirectangular().fitExtent([[4,4],[756,396]],{type:'FeatureCollection',features:feats});
  const path=GEO.geoPath(p);
  $('#world').innerHTML=feats.map(f=>`<path class="wc" data-id="${f.id}" d="${path(f)}"/>`).join('');
}

function hud(){$('#sc').textContent=G.score;$('#st').textContent=G.streak}

function renderQ(){
  const q=G.qs[G.i];G.tries=0;G.hint=false;G.solved=false;G.t0=Date.now();G.found=new Set();G.mist=0;
  const L=G.lv,mo=L.mapOpts||{};

   <div><button class="btn" id="next" hidden>Next</button></div>`;

function fb(txt,cls,fact){const f=$('#fb');f.className='fb '+(cls||'');f.innerHTML=esc(txt)+(fact?`<span class="fact">Did you know? ${esc(fact)}</span>`:'')}
function useHint(){
  const q=G.qs[G.i];if(G.solved||G.hint)return;G.hint=true;$('#hint').disabled=true;
  if(q.kind==='click'){
    const reg=q.hintReg;gC.querySelectorAll('.c').forEach(p=>{if(reg&&byId[p.dataset.id].reg!==reg)p.classList.add('dim')});
    fb(reg?`Hint: it is in ${REG[reg]}. Other regions are faded.`:'Hint: look for the highlighted area.');
    if(q.focus&&!reg)mark(q.focus,'target');
    if(q.reveal===undefined&&q.focus)focusOn(q.focus);
  }else if(q.kind==='mcq'){
    const wrong=[...app.querySelectorAll('.opt')].filter(b=>q.options[b.dataset.o]!==q.answer&&!b.disabled);
    shuffle(wrong).slice(0,Math.floor(q.options.length/2)).forEach(b=>{b.disabled=true;b.classList.add('wrong')});fb('Hint: some wrong answers were removed.');
  }else if(q.kind==='zone'){fb('Hint: '+q.hint);const z=gZones.querySelector(`[data-z="${q.zone}"]`);}
  else if(q.kind==='sweep'){fb('Hint: landlocked countries have no coast. Think of Mali, Chad, Zambia and Botswana.');
    [...gC.children].slice(0).forEach(()=>{});}
  else if(q.kind==='zanz'){fb('Hint: '+q.hint);focusOn(834)}
  else fb('Hint: '+q.hint);
  G.hintUsed=true;
}
function award(first){
  const q=G.qs[G.i];let base=[100,60,30][Math.min(G.tries,2)];
  if(G.hint)base=Math.max(10,base-20);
  let bonus=0;
  if(first){G.streak++;G.maxStreak=Math.max(G.maxStreak,G.streak);if(G.tries===0&&!G.hint){G.first++}bonus=G.tries===0?Math.min(G.streak,5)*10:0}
  if(G.lv.speed&&G.tries===0&&(Date.now()-G.t0)/1000<=10)bonus+=30;
  const pts=base+bonus;G.score+=pts;return{pts,bonus}
}
function finishQ(correct,msgOverride){
  const q=G.qs[G.i];G.solved=true;
  let pts=0;
  if(correct){const a=award(true);pts=a.pts;fb(`Correct! +${a.pts} points${a.bonus?` (bonus ${a.bonus})`:''}`,'good',q.fact)}
  else{G.streak=0;fb(msgOverride||'Not this time. The answer is shown.','bad',q.fact)}
  if(G.streak>=8&&!P.badges.includes('streak')){P.badges.push('streak');save()}
  P.bestStreak=Math.max(P.bestStreak||0,G.maxStreak);
  hud();$('#hint').disabled=true;const nx=$('#next');nx.hidden=false;nx.textContent=G.i===G.qs.length-1?'Finish level':'Next';nx.focus({preventScroll:true});
}
function wrongTry(msg){
  G.tries++;G.streak=0;hud();
  if(G.tries>=3){return true}
  fb(msg+' Try again.','bad');return false;
}
function answerMcq(b){
  const q=G.qs[G.i];if(G.solved)return;const val=q.options[b.dataset.o];
  if(val===q.answer){b.classList.add('right');app.querySelectorAll('.opt').forEach(x=>x.disabled=true);if(q.showCap)capMark(q.showCap);finishQ(true)}
  else{b.classList.add('wrong');b.disabled=true;
    if(wrongTry('That is not it.')){app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(q.options[x.dataset.o]===q.answer)x.classList.add('right')});if(q.showCap)capMark(q.showCap);finishQ(false)}}
}
function handleMapClick(e){
  const q=G.qs[G.i];if(!q||G.solved)return;
  if(q.kind==='zone'){const z=e.target.closest('.zone');if(!z){fb('Click on the water, not on the land.','bad');return}zoneClick(z.dataset.z);return}
  if(q.kind==='zanz'){if(e.target.id==='zhit'){const z=MAP.zanz;mark(834,'good');const d=document.createElementNS('http://www.w3.org/2000/svg','circle');d.setAttribute('cx',z[0]);d.setAttribute('cy',z[1]);d.setAttribute('r',5*sc());d.setAttribute('fill','#ffc83d');d.setAttribute('stroke','#0c2340');gMarks.appendChild(d);
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('class','ltxt');t.setAttribute('x',z[0]-9*sc());t.setAttribute('y',z[1]+4*sc());t.setAttribute('text-anchor','end');t.style.fontSize=(13*sc())+'px';t.style.strokeWidth=(3*sc())+'px';t.textContent='Zanzibar';gMarks.appendChild(t);finishQ(true)}
    else{const id=e.target.dataset&&e.target.dataset.id;if(wrongTry(id&&byId[id]?`That is ${byId[id].name}.`:'That is only water.')){const z=MAP.zanz;focusOn(834);finishQ(false,'Zanzibar is the small island off the coast of Tanzania.')}}return}
  const el=e.target.closest('[data-id]');if(!el||!el.dataset.id||el.closest('#hits')===null&&el.tagName==='circle')return;
  const id=+el.dataset.id;if(!byId[id])return;
  if(q.kind==='sweep'){sweepClick(id);return}
  if(q.kind!=='click')return;
  if(q.accept(id)){mark(id,'good');label(id,byId[id].name);if(q.showCapOnReveal)capMark(q.showCapOnReveal);finishQ(true)}
  else{mark(id,'bad');setTimeout(()=>{const x=cEl(id);x&&x.classList.remove('bad')},500);
    if(wrongTry(`That is ${byId[id].name}.`)){(q.reveal||q.target).forEach(t=>mark(t,'mist'));q.target.forEach(t=>label(t,byId[t].name));if(q.showCapOnReveal)capMark(q.showCapOnReveal);if(q.target[0])focusMaybe(q.target[0]);finishQ(false,q.reveal?'Not this time. The neighbours are flashing.':'Not this time. The country is flashing.')}}
}
function zoneClick(k){
  const q=G.qs[G.i];const zg=gZones.querySelector(`[data-z="${q.zone}"]`);
  const clicked=gZones.querySelector(`[data-z="${k}"]`);
  const addLabel=(key)=>{const p=MAP.zonePts[key==='atl'?'atl':key==='ind'?'ind':key];const g=gZones.querySelector(`[data-z="${key}"]`);const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('class','zl');t.setAttribute('x',p[0]);t.setAttribute('y',p[1]);t.textContent=ZONES[key].name;g.appendChild(t);g.querySelector('.zq').style.display='none'};
  if(k===q.zone){clicked.classList.add('good');addLabel(k);finishQ(true)}
  else{clicked.classList.add('bad');setTimeout(()=>clicked.classList.remove('bad'),600);
    if(wrongTry(`That is the ${ZONES[k].name}.`)){zg.classList.add('good');addLabel(q.zone);finishQ(false,'Not this time. The correct water is highlighted.')}}
}
function sweepClick(id){
  const q=G.qs[G.i];const c=byId[id];if(G.found.has(id))return;
  if(c.ll){G.found.add(id);mark(id,'good');$('#fc').textContent=G.found.size;
    if(G.found.size===16){G.tries=G.mist;sweepEnd()}}
  else{G.mist++;mark(id,'bad');setTimeout(()=>{const x=cEl(id);x&&x.classList.remove('bad')},500);$('#mc').textContent=G.mist;G.streak=0;hud();
    fb(`${c.name} has a coastline. Try again.`,'bad');
    if(G.mist>=4){C.filter(x=>x.ll&&!G.found.has(x.id)).forEach(x=>mark(x.id,'mist'));sweepEnd()}}
}
function sweepEnd(){
  const q=G.qs[G.i];const all=G.found.size===16;
  const pts=all?Math.max(40,160-G.mist*40):Math.round(G.found.size*5);
  G.solved=true;G.score+=pts;if(all&&G.mist===0){G.first++;G.streak++;G.maxStreak=Math.max(G.maxStreak,G.streak)}
  fb(all?`All 16 found! +${pts} points`:`You found ${G.found.size} of 16. The missing ones are flashing. +${pts} points`,all?'good':'bad',q.fact);
  hud();$('#hint').disabled=true;const nx=$('#next');nx.hidden=false;nx.textContent='Finish level';
}
function checkGlobe(){
  const q=G.qs[G.i];if(G.solved)return;
  const center=[-globe.rot[0],-globe.rot[1]];const d=GEO.geoDistance(center,[20,3])*180/Math.PI;
  if(d<26){G.globeSolved=true;drawGlobe(true);finishQ(true)}
  else{if(wrongTry(d<60?'Close! Africa is not quite in the middle.':'Africa is not in the circle yet.')){G.globeSolved=true;globe.rot=[-20,-3];drawGlobe(true);finishQ(false,'Not this time. The globe now shows Africa in gold.')}}
}
function worldClick(p){
  const q=G.qs[G.i];if(!q||q.kind!=='world'||G.solved)return;
  const id=+p.dataset.id;
  if(AFR.has(id)){$('#world').querySelectorAll('.wc').forEach(x=>{if(AFR.has(+x.dataset.id))x.classList.add('afr')});finishQ(true)}
  else{p.classList.add('bad');setTimeout(()=>p.classList.remove('bad'),500);
    if(wrongTry('That is not Africa.')){$('#world').querySelectorAll('.wc').forEach(x=>{if(AFR.has(+x.dataset.id))x.classList.add('afr')});finishQ(false,'Not this time. Africa is shown in gold.')}}
}
function nextQ(){
  if(G.i<G.qs.length-1){G.i++;renderQ()}else endLevel();
}
function endLevel(){
  const L=G.lv,n=G.qs.length;
  const acc=G.first/n;const st=acc>=.85?3:acc>=.6?2:1;
  const prev=P.levels[L.id]||{stars:0,best:0};
  const wasNew=!prev.stars;
  P.levels[L.id]={stars:Math.max(prev.stars,st),best:Math.max(prev.best,G.score)};
  const got=[];const give=k=>{if(!P.badges.includes(k)){P.badges.push(k);got.push(k)}};
  give(L.badge);
  if(['huntN','huntW','huntC','huntE','huntS'].every(k=>(P.levels[k]||{}).stars>0))give('mapmaster');
  if(G.first===n)give('perfect');
  if(G.maxStreak>=8)give('streak');
  const name=P.name||'Explorer';const tot=totalBest();
  const e=P.lb.find(r=>r.name===name);if(e)e.points=tot;else P.lb.push({name,points:tot});save();
  const idx=LEVELS.indexOf(L);const nextL=LEVELS[idx+1];const lock=nextL&&nextL.locked&&doneCount()<nextL.locked;
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="mbox" role="dialog" aria-label="Level complete"><h2>Level complete!</h2><div class="bigstars">${[1,2,3].map(i=>`<span class="${i<=st?'':'off'}">★</span>`).join('')}</div>
  <div class="big">${G.score} points</div><div>${G.first} of ${n} answered correctly on the first try. Best streak: ${G.maxStreak}.</div>
  ${got.length?`<div><b>New badges</b><div class="newb">${got.map(k=>`<span>${esc(BADGES[k][0])}</span>`).join('')}</div></div>`:''}
  <div><b>What you learned</b><ul>${L.learn.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>
  <div class="btns">${nextL&&!lock?`<button class="btn" id="mn">Next level</button>`:''}<button class="btn ghost" id="mr">Play again</button><button class="btn ghost" id="mh">All levels</button></div></div>`;
  document.body.appendChild(m);
  const close=()=>m.remove();
  m.querySelector('#mr').onclick=()=>{close();startLevel(L)};m.querySelector('#mh').onclick=()=>{close();home()};
  const mn=m.querySelector('#mn');if(mn)mn.onclick=()=>{close();startLevel(nextL)};
}
window.__game={LEVELS,get G(){return G},C,byId,start:id=>startLevel(levelById[id]),home};
home();
})();
</script>
